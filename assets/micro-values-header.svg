<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1448" role="img" aria-labelledby="title desc">
  <title id="title">Micro Values artwork</title>
  <desc id="desc">Layered translucent green, blue, cyan and lime geometric forms on a warm neutral field.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="21" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded">
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="0.7"/></filter>
  </defs>

  <rect width="2048" height="1448" fill="#ece5dd"/>
  <rect x="303" y="0" width="1340" height="1120" fill="#f5efe7"/>
  <rect x="409" y="0" width="86" height="1448" fill="#ffffff" opacity="0.92"/>
  <rect x="1640" y="0" width="110" height="1448" fill="#ffffff" opacity="0.9"/>
  <rect x="1390" y="660" width="658" height="112" fill="#ffffff" opacity="0.9"/>
  <rect x="1295" y="1030" width="465" height="418" fill="#f4d7b2" opacity="0.72"/>

  <g filter="url(#paper)">
    <polygon points="700,-40 960,45 1074,492 575,518" fill="#c47a17" opacity="0.75"/>
    <polygon points="727,0 1035,55 1240,408 1042,627 655,516" fill="#006345" opacity="0.78"/>
    <polygon points="952,73 1572,306 1370,697 1110,516" fill="#003d2d" opacity="0.88"/>
    <polygon points="523,402 1534,396 1370,715 565,664" fill="#007bc2" opacity="0.58"/>
    <polygon points="617,402 1005,405 879,1036 510,961" fill="#009fe3" opacity="0.72"/>
    <polygon points="761,400 1267,400 1345,926 713,936" fill="#04a7c7" opacity="0.48"/>
    <polygon points="1090,449 1495,640 1324,1042 1140,807" fill="#005c4f" opacity="0.63"/>
    <polygon points="600,636 984,828 1375,558 1310,829 815,828" fill="#b4f8ff" opacity="0.66"/>
    <polygon points="647,794 1138,998 866,1050 506,968" fill="#0094bb" opacity="0.68"/>
    <polygon points="887,831 1368,834 1307,1044 760,1045" fill="#00543c" opacity="0.66"/>
    <polygon points="781,1039 1393,1047 1321,1220 872,1111" fill="#efffce" opacity="0.55"/>
    <rect x="1264" y="630" width="276" height="284" fill="#bcf000" opacity="0.82"/>
    <rect x="1404" y="766" width="278" height="286" fill="#a8db00" opacity="0.9"/>
    <rect x="1314" y="658" width="202" height="258" fill="#6bd200" opacity="0.58"/>
    <rect x="1520" y="656" width="528" height="111" fill="#ffffff" opacity="0.85"/>
    <polygon points="963,486 1216,655 1039,817 808,667" fill="#d8f7f2" opacity="0.54"/>
  </g>

  <rect x="303" y="1120" width="1460" height="328" fill="#ede7df" opacity="0.94"/>
  <rect x="303" y="1120" width="1460" height="328" fill="#fff" opacity="0.08"/>
</svg>
